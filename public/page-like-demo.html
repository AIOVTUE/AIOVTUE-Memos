<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文章点赞演示</title>
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      .demo-wrap { max-width: 640px; margin: 48px auto; padding: 0 16px; }
      .like {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        background: #fff;
        border-radius: 999px;
        padding: 8px 14px;
        cursor: pointer;
      }
      .like.is-on { border-color: #df9193; color: #d4797c; }
      #pageLikeMsg { margin-top: 12px; color: #b15b5e; min-height: 1.4em; }
    </style>
  </head>
  <body>
    <div class="demo-wrap">
      <h1>文章点赞演示</h1>
      <p>请先在 <a href="/settings.html">设置页</a> 打开「启用文章点赞」，并在本站登录管理员后再点。不要把登录密码写进页面。</p>
      <button type="button" class="like" id="pageLikeBtn" aria-pressed="false">♡ <span id="pageLikeCount">0</span></button>
      <p id="pageLikeMsg"></p>
    </div>
    <script src="/js/page-like-demo.js"></script>
    <script src="/js/page-like.js"></script>
  </body>
</html>
